<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CollabNet — Real-time UDP Collaboration Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <header>
    <a href="#" class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
        </svg>
      </div>
      <span class="brand-name">CollabNet</span>
      <span class="brand-badge">UDP STREAM</span>
    </a>

    <div class="user-status-card">
      <div class="status-indicator">
        <div id="conn-dot" class="status-dot"></div>
        <span id="conn-text" style="color:#ffffff; font-weight: 700;">Đang kết nối...</span>
      </div>
      <div class="user-pill">
        <div id="user-avatar" class="avatar-sm">?</div>
        <span id="user-display" style="font-weight: 700; color:#fff;">---</span>
      </div>
    </div>
  </header>

  <main>
    <!-- USERS SIDEBAR -->
    <section class="panel panel-users">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Thành viên
        </div>
        <span id="user-count" class="badge-count">0 online</span>
      </div>
      <div id="user-list" class="user-list">
        <!-- User items rendered by app.js -->
      </div>
    </section>

    <!-- CHAT MAIN PANEL -->
    <section class="panel panel-chat">
      <div class="chat-active-bar">
        <div class="chat-recipient-info">
          <div id="chat-target-avatar" class="user-avatar broadcast-avatar"
            style="width:32px;height:32px;font-size:0.8rem;">
            *
          </div>
          <div>
            <div id="chat-target-title" class="chat-recipient-name">Mọi người (Broadcast)</div>
            <span id="chat-target-type" class="chat-recipient-tag">Phòng chat chung</span>
          </div>
        </div>
        <div>
          <select id="target" style="display:none;">
            <option value="*">Everyone</option>
          </select>
        </div>
      </div>

      <div id="messages" class="messages-container">
        <!-- Messages rendered by app.js -->
      </div>

      <div class="chat-input-bar">
        <div class="input-wrapper">
          <input id="text" class="chat-input" type="text" placeholder="Nhập tin nhắn... (nhấn Enter để gửi)"
            autocomplete="off">
        </div>
        <button class="btn-send" onclick="sendMessage()">
          <span>Gửi</span>
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </section>

    <!-- FILE TRANSFER PANEL -->
    <section class="panel panel-files">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
            <polyline points="13 2 13 9 20 9"></polyline>
          </svg>
          Truyền tệp UDP
        </div>
        <span class="badge-count">≤ 50 MB</span>
      </div>

      <div class="file-upload-box">
        <label class="dropzone" for="file">
          <div class="dropzone-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="2" x2="12" y2="15"></line>
            </svg>
          </div>
          <div class="dropzone-title">Chọn tệp gửi qua UDP</div>
          <div class="dropzone-sub">Cắt chunk 900B, xác thực SHA-256</div>
          <input id="file" type="file" style="display:none;" onchange="handleFileSelect(this)">
        </label>

        <div id="selected-file-box" class="selected-file-info">
          <span id="selected-file-name" style="overflow:hidden; text-overflow:ellipsis;"></span>
          <span id="selected-file-size" style="color:var(--text-muted); font-size:0.75rem;"></span>
        </div>

        <button class="btn-upload" onclick="sendFile()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
          Bắt đầu truyền tệp
        </button>
      </div>

      <div id="transfers" class="transfers-list">
        <!-- File transfers rendered by app.js -->
      </div>
    </section>
  </main>

  <div id="notice-toast">
    <span id="notice-toast-text"></span>
    <span style="cursor:pointer; font-weight:700;" onclick="hideNotice()">&times;</span>
  </div>

  <script src="/app.js"></script>
</body>

</html>
