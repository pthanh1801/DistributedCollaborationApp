<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập — CollabNet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>

<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-form-col">
        <div class="login-heading">
          <h1>ĐĂNG NHẬP HỆ THỐNG</h1>
          <p>Nhập tài khoản và mật khẩu để kết nối tới máy chủ.</p>
        </div>

        <div id="login-error" class="login-error" role="alert"></div>

        <form id="login-form" class="login-form" onsubmit="handleLogin(event)">
          <div class="form-field">
            <label for="username">Tên đăng nhập</label>
            <input id="username" name="username" type="text" placeholder="Ví dụ: alice" autocomplete="username" required autofocus>
          </div>

          <div class="form-field">
            <label for="password">Mật khẩu</label>
            <div class="password-input-wrap">
              <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
              <button type="button" class="btn-toggle-pw" onclick="togglePassword()" title="Hiện / Ẩn mật khẩu">
                <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-field">
            <label for="server">Máy chủ (Server IP)</label>
            <input id="server" name="server" type="text" value="127.0.0.1" placeholder="127.0.0.1" autocomplete="off">
          </div>

          <button id="btn-login" class="btn-login" type="submit">
            <span>Đăng nhập</span>
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
          </button>
        </form>

        <div class="login-footer-note">
          Xác thực qua TCP (mã hóa Fernet) • Truyền tin &amp; tệp qua UDP
        </div>
      </div>

      <div class="login-logo-col">
        <div class="login-logo-badge">
          <div class="brand-icon login-brand-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" />
            </svg>
          </div>
          <div class="login-logo-name">CollabNet</div>
          <span class="brand-badge">UDP STREAM</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function loadAuthDefaults() {
      try {
        const res = await fetch('/api/auth');
        if (!res.ok) return;
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/';
          return;
        }
        const serverInput = document.getElementById('server');
        if (serverInput && data.default_server) {
          serverInput.value = data.default_server;
        }
      } catch (_) {
      }
    }

    function togglePassword() {
      const pw = document.getElementById('password');
      if (!pw) return;
      pw.type = pw.type === 'password' ? 'text' : 'password';
    }

    function showError(message) {
      const box = document.getElementById('login-error');
      if (!box) return;
      box.textContent = message;
      box.style.display = 'block';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errorBox = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const server = document.getElementById('server').value.trim() || '127.0.0.1';

      if (errorBox) errorBox.style.display = 'none';
      if (btn) {
        btn.disabled = true;
        btn.querySelector('span').textContent = 'Đang đăng nhập...';
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, server })
        });
        const result = await res.json();
        if (!res.ok || !result.ok) {
          throw new Error(result.error || 'Đăng nhập không thành công.');
        }
        window.location.href = '/';
      } catch (err) {
        showError(err.message || 'Không thể đăng nhập.');
        if (btn) {
          btn.disabled = false;
          btn.querySelector('span').textContent = 'Đăng nhập';
        }
      }
    }

    loadAuthDefaults();
  </script>
</body>

</html>
